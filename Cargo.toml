[workspace]
members = [".", "core", "server"]

[package]
name = "galebound"
version = "0.9.0"
edition = "2021"
description = "Galebound Online - a side-scrolling action MMO prototype"

[dependencies]
galebound-core = { path = "core" }
macroquad = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
